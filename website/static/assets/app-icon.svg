<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="stage0-title">
  <title id="stage0-title">Stage0 — local-first Git branch review &amp; Virtual MR</title>
  <defs>
    <!-- macOS Big Sur standard icon drop shadow -->
    <filter id="macos-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Container: macOS-style 824x824 squircle (rx = 185px) centered with 100px padding -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#9333ea" filter="url(#macos-drop-shadow)"/>
  <rect x="106" y="106" width="812" height="812" rx="179" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Stylized git branch icon scaled from 512x512 into 824x824 (scale = 824/512 = 1.609375) -->
  <g transform="translate(100, 100) scale(1.609375)" fill="none" stroke-linecap="round">
    <!-- Branch merge curve (light gray) -->
    <path d="M352 208 A144 144 0 0 1 208 352" stroke="#e4e4e7" stroke-width="32"/>

    <!-- Main trunk (white) -->
    <path d="M160 112 V304" stroke="#ffffff" stroke-width="32"/>

    <!-- Branch head node (light gray) -->
    <circle cx="352" cy="160" r="48" stroke="#e4e4e7" stroke-width="32"/>

    <!-- Trunk node (white) -->
    <circle cx="160" cy="352" r="48" stroke="#ffffff" stroke-width="32"/>
  </g>
</svg>
