name: Scheduled release channels
on:
  schedule:
    # Start 60 minutes before 00:00 UTC so validation, multi-platform builds and
    # draft upload finish beforehand; publication holds until exact 00:00:00 UTC.
    - cron: '0 23 * * *'
    - cron: '0 23 26 * *'
    - cron: '0 23 31 3,12 *'
    - cron: '0 23 30 6,9 *'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'anhquoctran/stage0'
    runs-on: ubuntu-22.04
    concurrency:
      group: stage0-release-preparation
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish_at: ${{ steps.version.outputs.publish_at }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare ordered channel commits and tags from source branches
        id: version
        env:
          RELEASE_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/prepare-release.mjs prepare "$RELEASE_SCHEDULE"
  release:
    needs: prepare
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      publish_at: ${{ needs.prepare.outputs.publish_at }}
    secrets: inherit
