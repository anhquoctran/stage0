name: Release Stage0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_at:
        description: 'Publication time in UTC (automation; leave empty for immediate publication)'
        required: false
        type: string
      source_sha:
        description: 'Expected immutable tag commit (automation)'
        required: false
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish_at:
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    # Stable publication requires a scheduled/reusable channel release or a
    # deliberate Run workflow action on GitHub. A raw stable tag push cannot publish it.
    if: >-
      github.repository == 'anhquoctran/stage0' &&
      (github.ref_type == 'tag' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_call' ||
       contains(inputs.tag || github.ref_name, '-nightly') ||
       contains(inputs.tag || github.ref_name, '-beta'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
      pull-requests: read
      security-events: read
    concurrency:
      group: stage0-release-prepare-${{ inputs.tag || github.ref_name || 'manual' }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.snapshot.outputs.tag }}
      sha: ${{ steps.snapshot.outputs.sha }}
      channel: ${{ steps.snapshot.outputs.channel }}
      should_build: ${{ steps.snapshot.outputs.should_build }}
      previous_tag: ${{ steps.snapshot.outputs.previous_tag }}
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
      regression_base: ${{ steps.snapshot.outputs.regression_base }}
      publish_at: ${{ inputs.publish_at || '' }}
    steps:
      - name: Verify dispatched tag snapshot
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.source_sha || '' }}
        run: |
          if [[ -n "$EXPECTED_RELEASE_SHA" && "$GITHUB_SHA" != "$EXPECTED_RELEASE_SHA" ]]; then
            echo 'Dispatched tag does not match the prepared immutable snapshot.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare immutable release snapshot and tag
        id: snapshot
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_INPUT_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/manual-release.mjs
      - name: Dispatch isolated tag release
        if: github.ref_type != 'tag' && steps.snapshot.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.snapshot.outputs.tag }}
          RELEASE_SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
          RELEASE_PUBLISH_AT: ${{ inputs.publish_at || '' }}
        run: node scripts/dispatch-tag-release.mjs

  validate:
    # Builds execute in the tag's cache namespace, never the controller's main scope.
    if: github.ref_type == 'tag' && needs.prepare.outputs.should_build == 'true'
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      REGRESSION_BASE: ${{ needs.prepare.outputs.regression_base }}
    steps:
      - name: Preserve canonical test bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-artifacts.mjs version "$RELEASE_TAG"
      - run: pnpm check:architecture
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run frozen target Node regressions
        if: needs.prepare.outputs.channel != 'nightly'
        shell: bash
        run: |
          git show "$REGRESSION_BASE:scripts/release-regression-runner.mjs" > "$RUNNER_TEMP/stage0-regressions.mjs"
          node "$RUNNER_TEMP/stage0-regressions.mjs" "$REGRESSION_BASE" node

  build:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            target_os: linux
            arch: x64
            bundles: appimage,deb,rpm
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            target_os: linux
            arch: arm64
            bundles: deb,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_os: windows
            arch: x64
            bundles: nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            target_os: windows
            arch: arm64
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            target_os: macos
            arch: arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            target_os: macos
            arch: x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      STAGE0_RELEASE_DATE: ${{ needs.prepare.outputs.publish_at }}
      TARGET_OS: ${{ matrix.target_os }}
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BUNDLES: ${{ matrix.bundles }}
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
      REGRESSION_BASE: ${{ needs.prepare.outputs.regression_base }}
    steps:
      - name: Preserve canonical test bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfontconfig1-dev libfreetype6-dev xdg-utils rpm
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
      - name: Prepare Windows OpenSSL Perl before tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install strawberryperl --no-progress --yes
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
      - name: Run frozen target Rust regressions
        if: needs.prepare.outputs.channel != 'nightly'
        shell: bash
        run: |
          git show "$REGRESSION_BASE:scripts/release-regression-runner.mjs" > "$RUNNER_TEMP/stage0-regressions.mjs"
          node "$RUNNER_TEMP/stage0-regressions.mjs" "$REGRESSION_BASE" rust
      - name: Run Rust tests
        env:
          STAGE0_RUST_TEST_MANIFEST: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test --locked --manifest-path backend/Cargo.toml --lib
      - name: Generate changelog for this release snapshot
        shell: bash
        run: node scripts/release-changelog.mjs "$RELEASE_TAG" "$RELEASE_SOURCE_SHA" "$RELEASE_PREVIOUS_TAG"
      - run: node scripts/generate-about-info.mjs
      - name: Build versioned and signed packages
        shell: bash
        env:
          STAGE0_RUST_TEST_MANIFEST: '0'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          pnpm exec tauri build --ci --target "$RELEASE_TARGET" --bundles "$RELEASE_BUNDLES" -- --locked
      - name: Collect uniquely named assets
        shell: bash
        run: node scripts/release-artifacts.mjs collect "backend/target/$RELEASE_TARGET/release/bundle" release-assets "$RELEASE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    concurrency:
      group: stage0-release-publication-${{ needs.prepare.outputs.channel }}
      cancel-in-progress: false
    env:
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_PUBLISH_AT: ${{ needs.prepare.outputs.publish_at }}
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    permissions:
      contents: write
      pull-requests: read
      security-events: read
      actions: read
    steps:
      - name: Preserve canonical test bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/release-artifacts.mjs manifest release-assets "$RELEASE_TAG" "$RELEASE_PUBLISH_AT"
      - name: Verify every package against the embedded public key
        run: cargo run --locked --manifest-path scripts/release-verifier/Cargo.toml -- release-assets
      - name: Upload to draft, wait for exact release window, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/release-changelog.mjs "$RELEASE_TAG" "$RELEASE_SOURCE_SHA" "$RELEASE_PREVIOUS_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json')).isDraft) throw new Error('Refusing to replace an already published release')"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Stage0 $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          node scripts/prepare-release.mjs wait "$RELEASE_PUBLISH_AT"
          RELEASE_CHANNEL="$RELEASE_CHANNEL" node scripts/release-promotion-cli.mjs verify-release
          CHANNEL=$(node --input-type=module -e 'import {releaseChannel} from "./scripts/release-channels.mjs"; console.log(releaseChannel(process.env.RELEASE_TAG.slice(1)))')
          if [[ "$CHANNEL" == "stable" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
          # Channel manifests only point to immutable, version-signed package URLs.
          ALIAS="channel-$CHANNEL"
          if ! gh release view "$ALIAS" >/dev/null 2>&1; then
            gh release create "$ALIAS" --target "$(git rev-parse HEAD)" --prerelease --latest=false --title "Stage0 $CHANNEL update feed" --notes "Manifest for the $CHANNEL update channel."
          fi
          gh release upload "$ALIAS" release-assets/latest.json --clobber
