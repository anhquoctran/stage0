name: Release Stage0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage0-release-publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    # Stable publication requires a deliberate Run workflow action on GitHub.
    # A stable tag push or scheduled/reusable call cannot publish it.
    if: >-
      github.repository == 'anhquoctran/stage0' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(inputs.tag || github.ref_name, '-nightly.') ||
       contains(inputs.tag || github.ref_name, '-beta.'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.snapshot.outputs.tag }}
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare immutable release snapshot and tag
        id: snapshot
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
          RELEASE_INPUT_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/manual-release.mjs

  validate:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-artifacts.mjs version "$RELEASE_TAG"
      - run: pnpm check:architecture
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            target_os: linux
            arch: x64
            bundles: appimage,deb,rpm
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            target_os: linux
            arch: arm64
            bundles: deb,rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            target_os: windows
            arch: x64
            bundles: nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            target_os: windows
            arch: arm64
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            target_os: macos
            arch: arm64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            target_os: macos
            arch: x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET_OS: ${{ matrix.target_os }}
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfontconfig1-dev libfreetype6-dev xdg-utils rpm
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
      - name: Run Rust tests
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path backend/Cargo.toml --lib
      - run: node scripts/generate-about-info.mjs
      - name: Build versioned and signed packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # Git Bash's bundled Perl lacks Locale::Maketext::Simple, which
          # vendored OpenSSL needs while building SQLCipher on Windows.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if ! perl -MLocale::Maketext::Simple -e 'exit 0' 2>/dev/null; then
              choco install strawberryperl --no-progress --yes
            fi
            export PATH="/c/Strawberry/perl/bin:$PATH"
            perl -MLocale::Maketext::Simple -e 'exit 0'
          fi
          pnpm exec tauri build --ci --target "$RELEASE_TARGET" --bundles "$RELEASE_BUNDLES" -- --locked
      - name: Collect uniquely named assets
        shell: bash
        run: node scripts/release-artifacts.mjs collect "backend/target/$RELEASE_TARGET/release/bundle" release-assets "$RELEASE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/release-artifacts.mjs manifest release-assets "$RELEASE_TAG"
      - name: Verify every package against the embedded public key
        run: cargo run --locked --manifest-path scripts/release-verifier/Cargo.toml -- release-assets
      - name: Upload to draft, then publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json')).isDraft) throw new Error('Refusing to replace an already published release')"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Stage0 $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          CHANNEL=$(node --input-type=module -e 'import {releaseChannel} from "./scripts/release-channels.mjs"; console.log(releaseChannel(process.env.RELEASE_TAG.slice(1)))')
          if [[ "$CHANNEL" == "stable" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          fi
          # Channel manifests only point to immutable, version-signed package URLs.
          ALIAS="channel-$CHANNEL"
          if ! gh release view "$ALIAS" >/dev/null 2>&1; then
            gh release create "$ALIAS" --target "$(git rev-parse HEAD)" --prerelease --latest=false --title "Stage0 $CHANNEL update feed" --notes "Manifest for the $CHANNEL update channel."
          fi
          gh release upload "$ALIAS" release-assets/latest.json --clobber
