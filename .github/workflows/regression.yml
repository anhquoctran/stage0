name: Protected regressions
run-name: 'Regression checks · PR #${{ github.event.pull_request.number }} · ${{ github.base_ref }} · ${{ github.event.pull_request.head.sha }}'

on:
  # One required-check suite per PR head. A second push suite with the same
  # job names leaves cancelled required checks when PR concurrency supersedes it.
  pull_request:
    branches: [develop, beta, main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: protected-regressions-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Regression gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Preserve canonical test bytes across platforms
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || 'develop' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted baseline runner before switching to candidate
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            BASELINE_SHA="$PR_BASE_SHA"
          else
            BASE_BRANCH=develop
            if [[ "$SOURCE_BRANCH" =~ ^hotfix/(sync-)?(main|beta|develop)/ ]]; then
              BASE_BRANCH="${BASH_REMATCH[2]}"
            fi
            BASELINE_SHA=$(git rev-parse "origin/$BASE_BRANCH")
          fi
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          if git cat-file -e "$BASELINE_SHA:scripts/release-regression-runner.mjs" 2>/dev/null; then
            git show "$BASELINE_SHA:scripts/release-regression-runner.mjs" > "$RUNNER_TEMP/stage0-regressions.mjs"
          else
            echo 'REGRESSION_BOOTSTRAP=true' >> "$GITHUB_ENV"
          fi
          if ! git cat-file -e "$BASELINE_SHA:shared/release-regressions.json" 2>/dev/null; then
            echo 'REGRESSION_BOOTSTRAP=true' >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libfontconfig1-dev libfreetype6-dev xdg-utils
      - name: Prepare Windows OpenSSL Perl
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install strawberryperl --no-progress --yes
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap only the first control-plane rollout
        if: env.REGRESSION_BOOTSTRAP == 'true'
        shell: bash
        run: test -f "$RUNNER_TEMP/stage0-regressions.mjs" || cp scripts/release-regression-runner.mjs "$RUNNER_TEMP/stage0-regressions.mjs"
      - run: pnpm check:architecture
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run React DOM tests on macOS and Windows
        if: runner.os != 'Linux'
        run: pnpm test:react
      - name: Measure frontend coverage including untested application sources
        if: runner.os == 'Linux'
        run: pnpm test:coverage:react
      - name: Install Chromium for real layout/focus regressions
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run React browser regressions
        if: runner.os == 'Linux'
        run: pnpm test:react:browser
      - name: Run frozen target regressions against candidate code
        shell: bash
        run: |
          node "$RUNNER_TEMP/stage0-regressions.mjs" "$BASELINE_SHA" node
          node "$RUNNER_TEMP/stage0-regressions.mjs" "$BASELINE_SHA" rust
      - name: Run complete candidate Rust suite
        if: runner.os != 'Linux'
        env:
          STAGE0_RUST_TEST_MANIFEST: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: cargo test --locked --manifest-path backend/Cargo.toml --lib
      - name: Install pinned Rust coverage tooling
        if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run complete candidate Rust suite with coverage
        if: runner.os == 'Linux'
        run: pnpm test:coverage:rust
      - name: Enforce coverage floors against the trusted PR base
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/check-test-coverage.mjs --baseline-ref "$BASELINE_SHA"
      - name: Preserve coverage reports and browser diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-test-coverage
          path: |
            coverage/
            .vitest/attachments/
          retention-days: 7
          if-no-files-found: error
