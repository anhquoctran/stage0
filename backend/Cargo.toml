[package]
name = "stage0"
version = "0.1.2"
description = "Stage0 - Local Virtual MR / PR Sandbox"
authors = ["Anh Quoc Tran"]
license = "MIT"
edition = "2021"

[lib]
name = "stage0_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
dunce = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.39.6"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
sha2 = "0.10"
zeroize = "1"
semver = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "time", "process", "net"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
uuid = { version = "1.8", features = ["v4"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
notify-rust = "4.11"
zbus = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
