[package]
name = "stage0"
version = "0.1.11"
description = "Stage0 - Local Virtual MR / PR Sandbox"
authors = ["Anh Quoc Tran"]
license = "MIT"
edition = "2021"

[lib]
name = "stage0_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
dunce = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.39.6"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
sha2 = "0.10"
fs2 = "0.4"
font-kit = "0.14.3"
zeroize = "1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "time", "process", "net"] }
notify = "6.1"
notify-debouncer-mini = "0.4"
uuid = { version = "1.8", features = ["v4"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zip = { version = "9", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = {
    version = "0.61",
    features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"],
}

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
core-foundation = "0.10"
security-framework-sys = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
notify-rust = "4.11"
zbus = "5"

# GTK3 pins glib to 0.18.x. Backport the upstream VariantStrIter safety fix
# without changing its API/version or substituting an unrelated 0.20 release.
[patch.crates-io]
glib = { path = "vendor/glib" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
