<!doctype html>
<html lang="en" data-theme="mocha" class="mocha dark">
  <head>
    <meta charset="UTF-8" />
    <script src="/startup.js"></script>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      id="viewer-font-stylesheet"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Source+Code+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Victor+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      media="print"
    />
    <title>Stage0 - Virtual MR Sandbox</title>
    <style>
      :root,
      [data-theme="mocha"],
      [data-theme="dark"] {
        --splash-bg: #11111b;
        --splash-text: #cdd6f4;
        --splash-subtext: #bac2de;
        --splash-status: #a6adc8;
        --splash-muted: #7f849c;
        --splash-brand: #b87ff4;
        --splash-title-accent: #89b4fa;
        --splash-logo-border: rgba(184, 127, 244, 0.4);
        --splash-logo-bg: linear-gradient(135deg, rgba(184, 127, 244, 0.2), rgba(184, 127, 244, 0.1) 55%, #313244);
        --splash-logo-shadow: 0 12px 30px rgba(184, 127, 244, 0.12);
        --splash-track-border: rgba(49, 50, 68, 0.4);
        --splash-track-bg: rgba(49, 50, 68, 0.6);
        --splash-glow-blue: rgba(137, 180, 250, 0.1);
        --splash-glow-purple: rgba(203, 166, 247, 0.1);
        --splash-peach: #fab387;
        --splash-teal: #94e2d5;
        --splash-green: #a6e3a1;
        --splash-error: #f38ba8;
        --splash-warning: #fab387;
      }

      [data-theme="mocha-light"],
      [data-theme="latte"],
      [data-theme="light"] {
        --splash-bg: #dce0e8;
        --splash-text: #3b3e53;
        --splash-subtext: #4b5066;
        --splash-status: #5b6075;
        --splash-muted: #666c80;
        --splash-brand: #8839ef;
        --splash-title-accent: #1e66f5;
        --splash-logo-border: rgba(136, 57, 239, 0.38);
        --splash-logo-bg: linear-gradient(135deg, rgba(136, 57, 239, 0.16), rgba(136, 57, 239, 0.07) 55%, #bec4d0);
        --splash-logo-shadow: 0 12px 30px rgba(76, 79, 105, 0.16);
        --splash-track-border: rgba(150, 158, 174, 0.72);
        --splash-track-bg: rgba(190, 196, 208, 0.72);
        --splash-glow-blue: rgba(30, 102, 245, 0.12);
        --splash-glow-purple: rgba(136, 57, 239, 0.1);
        --splash-peach: #fe640b;
        --splash-teal: #179299;
        --splash-green: #40a02b;
        --splash-error: #c62845;
        --splash-warning: #9a5b00;
      }

      html,
      body {
        background-color: var(--splash-bg);
        color: var(--splash-text);
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
        opacity: 1;
        transform: scale(1);
        transition: opacity 350ms ease, transform 350ms ease;
      }

      #startup-splash.is-hidden {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      #startup-splash .splash-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        filter: blur(48px);
        pointer-events: none;
      }

      #startup-splash .splash-glow-top {
        top: 25%;
        left: -80px;
        background: var(--splash-glow-blue);
      }

      #startup-splash .splash-glow-bottom {
        right: -80px;
        bottom: 25%;
        background: var(--splash-glow-purple);
      }

      #startup-splash .splash-content {
        position: relative;
        display: flex;
        width: min(100%, 384px);
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        text-align: center;
      }

      #startup-splash .splash-logo {
        display: flex;
        width: 80px;
        height: 80px;
        flex-shrink: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 24px;
        border: 1px solid var(--splash-logo-border);
        border-radius: 16px;
        background: var(--splash-logo-bg);
        box-shadow: var(--splash-logo-shadow);
        color: var(--splash-brand);
      }

      #startup-splash .splash-logo svg {
        width: 32px;
        height: 32px;
      }

      #startup-splash .splash-logo-label {
        color: var(--splash-brand);
        font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #startup-splash .splash-title {
        margin: 0 0 6px;
        color: var(--splash-text);
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      #startup-splash .splash-title-accent {
        color: var(--splash-title-accent);
      }

      #startup-splash .splash-tagline {
        margin: 0 0 24px;
        color: var(--splash-subtext);
        font-size: 12px;
        line-height: 1.5;
      }

      #startup-splash .splash-progress-track {
        width: 100%;
        height: 6px;
        margin-bottom: 14px;
        overflow: hidden;
        border: 1px solid var(--splash-track-border);
        border-radius: 999px;
        background: var(--splash-track-bg);
      }

      #startup-splash .splash-progress {
        width: 66.666%;
        height: 100%;
        border-radius: 999px;
        background: var(--splash-brand);
        animation: startup-splash-progress 1.6s ease-in-out infinite;
      }

      #startup-splash .splash-status {
        min-height: 20px;
        color: var(--splash-status);
        font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-size: 11px;
      }

      #startup-splash .splash-highlights {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        color: var(--splash-muted);
        font-size: 10px;
        font-weight: 500;
      }

      #startup-splash .splash-highlight {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }

      #startup-splash .splash-highlight-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      @keyframes startup-splash-progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(35%); }
        100% { transform: translateX(180%); }
      }
    </style>
  </head>
  <body class="bg-crust text-text antialiased h-screen overflow-hidden select-none" style="background-color: var(--splash-bg); margin: 0;">
    <div id="root" class="h-full w-full"></div>
    <div id="startup-splash" role="status" aria-live="polite">
      <div class="splash-glow splash-glow-top"></div>
      <div class="splash-glow splash-glow-bottom"></div>
      <div class="splash-content">
        <div class="splash-logo" aria-label="Stage0 logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8" />
            <line x1="16" y1="8" x2="8" y2="16" stroke-width="2" opacity="0.65" />
            <circle cx="12" cy="4" r="1.5" fill="currentColor" />
            <circle cx="12" cy="20" r="1.5" fill="currentColor" />
          </svg>
          <span class="splash-logo-label">STAGE0</span>
        </div>
        <h1 class="splash-title">Stage<span class="splash-title-accent">0</span></h1>
        <p class="splash-tagline">Local-first Virtual Merge Request &amp; Conflict Prediction Sandbox</p>
        <div class="splash-progress-track" aria-hidden="true">
          <div class="splash-progress"></div>
        </div>
        <div class="splash-status">Initializing Stage0 runtime...</div>
        <div class="splash-highlights" aria-hidden="true">
          <span class="splash-highlight"><span class="splash-highlight-dot" style="background:var(--splash-peach)"></span>No Checkout</span>
          <span>·</span>
          <span class="splash-highlight"><span class="splash-highlight-dot" style="background:var(--splash-teal)"></span>git merge-tree</span>
          <span>·</span>
          <span class="splash-highlight"><span class="splash-highlight-dot" style="background:var(--splash-green)"></span>Sandbox Adapters</span>
        </div>
      </div>
    </div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
