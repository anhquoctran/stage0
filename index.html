<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/startup.js"></script>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      id="viewer-font-stylesheet"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Source+Code+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Victor+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      media="print"
    />
    <title>Stage0 - Virtual MR Sandbox</title>
    <style>
      :root,
      [data-theme="mocha"],
      [data-theme="dark"] {
        --splash-bg: #11111b;
        --splash-text: #cdd6f4;
        --splash-subtext: #bac2de;
        --splash-status: #a6adc8;
        --splash-muted: #7f849c;
        --splash-brand: #9333ea;
        --splash-title-accent: #89b4fa;
        --splash-logo-border: rgba(147, 51, 234, 0.4);
        --splash-logo-bg: linear-gradient(135deg, rgba(147, 51, 234, 0.2), rgba(147, 51, 234, 0.1) 55%, #313244);
        --splash-logo-shadow: 0 12px 30px rgba(147, 51, 234, 0.12);
        --splash-track-border: rgba(49, 50, 68, 0.4);
        --splash-track-bg: rgba(49, 50, 68, 0.6);
        --splash-frame-border: #313244;
        --splash-glow-blue: rgba(137, 180, 250, 0.1);
        --splash-glow-purple: rgba(147, 51, 234, 0.1);
        --splash-peach: #fab387;
        --splash-teal: #94e2d5;
        --splash-green: #a6e3a1;
        --splash-error: #f38ba8;
        --splash-warning: #fab387;
      }

      [data-theme="mocha-light"],
      [data-theme="latte"],
      [data-theme="light"] {
        --splash-bg: #dce0e8;
        --splash-text: #3b3e53;
        --splash-subtext: #4b5066;
        --splash-status: #5b6075;
        --splash-muted: #666c80;
        --splash-brand: #9333ea;
        --splash-title-accent: #1e66f5;
        --splash-logo-border: rgba(147, 51, 234, 0.38);
        --splash-logo-bg: linear-gradient(135deg, rgba(147, 51, 234, 0.16), rgba(147, 51, 234, 0.07) 55%, #bec4d0);
        --splash-logo-shadow: 0 12px 30px rgba(76, 79, 105, 0.16);
        --splash-track-border: rgba(150, 158, 174, 0.72);
        --splash-track-bg: rgba(190, 196, 208, 0.72);
        --splash-frame-border: #bec4d0;
        --splash-glow-blue: rgba(30, 102, 245, 0.12);
        --splash-glow-purple: rgba(147, 51, 234, 0.1);
        --splash-peach: #fe640b;
        --splash-teal: #179299;
        --splash-green: #40a02b;
        --splash-error: #c62845;
        --splash-warning: #9a5b00;
      }

      html,
      body {
        background-color: var(--splash-bg);
        color: var(--splash-text);
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
        opacity: 1;
        transform: scale(1);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      [data-platform="macos"] #startup-splash {
        box-sizing: border-box;
        border: 1px solid var(--splash-frame-border);
        border-radius: 4px;
      }

      #startup-splash.is-hidden {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      #startup-splash .splash-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 0;
        filter: blur(48px);
        pointer-events: none;
      }

      #startup-splash .splash-glow-top {
        top: 25%;
        left: -80px;
        background: var(--splash-glow-blue);
      }

      #startup-splash .splash-glow-bottom {
        right: -80px;
        bottom: 25%;
        background: var(--splash-glow-purple);
      }

      #startup-splash .splash-content {
        position: relative;
        display: flex;
        width: min(100%, 400px);
        box-sizing: border-box;
        border-radius: 4px;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
        text-align: center;
      }

      #startup-splash .splash-logo {
        display: block;
        width: 80px;
        height: 80px;
        flex-shrink: 0;
        margin-bottom: 24px;
        filter: drop-shadow(0 12px 28px rgba(147, 51, 234, 0.28));
      }

      #startup-splash .splash-title {
        margin: 0 0 6px;
        color: var(--splash-text);
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      #startup-splash .splash-title-accent {
        color: var(--splash-title-accent);
      }

      #startup-splash .splash-tagline {
        margin: 0 0 24px;
        color: var(--splash-subtext);
        font-size: 12px;
        line-height: 1.5;
      }

      #startup-splash .splash-progress-info {
        position: absolute;
        right: 16px;
        bottom: 14px;
        left: 16px;
        display: flex;
        z-index: 1;
        flex-direction: column;
        gap: 3px;
      }

      #startup-splash .splash-progress-header {
        width: 100%;
        margin: 0;
      }

      #startup-splash .splash-progress-footer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        width: 100%;
        align-items: end;
        gap: 16px;
      }

      #startup-splash .splash-progress-track {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 6px;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: var(--splash-track-bg);
      }

      #startup-splash .splash-progress {
        width: 0%;
        height: 100%;
        border-radius: 0;
        background-color: var(--splash-brand);
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.28) 0 7px,
          transparent 7px 14px
        );
        background-size: 20px 20px;
        animation: splash-progress-stripes 900ms linear infinite;
        transition: width 180ms ease-out;
      }

      @keyframes splash-progress-stripes {
        to { background-position: 20px 0; }
      }

      #startup-splash .splash-status {
        min-width: 0;
        color: var(--splash-status);
        font-size: 12px;
        line-height: 1.5;
        text-align: left;
      }

      #startup-splash .splash-percentage {
        min-width: 4ch;
        line-height: 18px;
        text-align: right;
        color: var(--splash-text);
        font-family: 'Fira Code', 'SFMono-Regular', Consolas, monospace;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      #startup-splash .splash-detail {
        min-width: 0;
        min-height: 18px;
        margin: 0;
        color: var(--splash-muted);
        font-size: 11px;
        line-height: 1.6;
        text-align: left;
      }

      #startup-splash[data-state="error"] .splash-progress {
        background-color: var(--splash-error);
      }

      #startup-splash[data-state="error"] .splash-status {
        color: var(--splash-error);
      }

      #startup-splash .splash-reload {
        margin-top: 16px;
        padding: 8px 14px;
        border: 0;
        border-radius: 4px;
        background: var(--splash-brand);
        color: #ffffff;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      #startup-splash .splash-reload:focus-visible {
        outline: 2px solid var(--splash-title-accent);
        outline-offset: 3px;
      }

      #startup-splash .splash-highlights {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        color: var(--splash-muted);
        font-size: 10px;
        font-weight: 500;
      }

      #startup-splash .splash-highlight {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }

      #startup-splash .splash-highlight-dot {
        width: 6px;
        height: 6px;
        border-radius: 0;
      }

      @media (max-height: 480px) {
        #startup-splash .splash-content { width: min(100%, 440px); }
        #startup-splash .splash-logo { width: 48px; height: 48px; margin-bottom: 12px; }
        #startup-splash .splash-title { margin-bottom: 4px; }
        #startup-splash .splash-tagline { margin-bottom: 16px; }
        #startup-splash .splash-highlights { margin-top: 20px; }
        #startup-splash[data-state="error"] .splash-highlights { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-splash,
        #startup-splash .splash-progress {
          transition: none;
        }
        #startup-splash .splash-progress { animation: none; }
        #startup-splash.is-hidden { transform: none; }
      }
    </style>
  </head>
  <body class="bg-crust text-text antialiased h-screen overflow-hidden select-none" style="background-color: var(--splash-bg); margin: 0;">
    <div id="root" class="h-full w-full"></div>
    <div id="startup-splash" data-state="loading" aria-label="Starting Stage0">
      <div class="splash-glow splash-glow-top"></div>
      <div class="splash-glow splash-glow-bottom"></div>
      <div class="splash-content">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="80" height="80" class="splash-logo" role="img" aria-label="Stage0 logo">
          <title>Stage0</title>
          <rect width="512" height="512" rx="143.36" fill="#9333ea" />
          <rect x="4" y="4" width="504" height="504" rx="139.36" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />
          <g fill="none" stroke-linecap="round">
            <path d="M352 208 A144 144 0 0 1 208 352" stroke="#e4e4e7" stroke-width="32" />
            <path d="M160 112 V304" stroke="#ffffff" stroke-width="32" />
            <circle cx="352" cy="160" r="48" stroke="#e4e4e7" stroke-width="32" />
            <circle cx="160" cy="352" r="48" stroke="#ffffff" stroke-width="32" />
          </g>
        </svg>
        <h1 class="splash-title">Stage<span class="splash-title-accent">0</span></h1>
        <p class="splash-tagline">Local-first Virtual Merge Request &amp; Conflict Prediction Sandbox</p>
        <button id="splash-reload" class="splash-reload btn-solid" type="button" hidden>Reload Stage0</button>
        <div class="splash-highlights" aria-hidden="true">
          <span class="splash-highlight"><span class="splash-highlight-dot" style="background:var(--splash-peach)"></span>No Checkout</span>
          <span>·</span>
          <span class="splash-highlight"><span class="splash-highlight-dot" style="background:var(--splash-teal)"></span>git merge-tree</span>
          <span>·</span>
          <span class="splash-highlight"><span class="splash-highlight-dot" style="background:var(--splash-green)"></span>Sandbox Adapters</span>
        </div>
      </div>
      <div class="splash-progress-info">
        <div class="splash-progress-header">
          <div id="splash-status" class="splash-status" role="status" aria-live="polite" aria-atomic="true">Starting Stage0</div>
        </div>
        <div class="splash-progress-footer">
          <div id="splash-detail" class="splash-detail">Step 1 of 7</div>
          <span id="splash-percentage" class="splash-percentage" aria-hidden="true">0%</span>
        </div>
      </div>
      <div id="startup-progress" class="splash-progress-track" role="progressbar" aria-labelledby="splash-status" aria-describedby="splash-detail" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Starting Stage0 · 0%">
        <div id="startup-progress-fill" class="splash-progress"></div>
      </div>
    </div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
