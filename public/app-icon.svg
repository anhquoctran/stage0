<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cba6f6"/>
      <stop offset="100%" stop-color="#a678eb"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle brand stroke -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#cba6f6" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Stage0 Symbol: Stylized 0 with Virtual MR Nodes in brand color #cba6f6 -->
  <circle cx="64" cy="64" r="32" stroke="url(#brand-grad)" stroke-width="7" fill="none"/>
  <line x1="77" y1="51" x2="51" y2="77" stroke="#cba6f6" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Glowing Nodes representing branch commit points -->
  <circle cx="64" cy="32" r="5" fill="#cba6f6"/>
  <circle cx="64" cy="96" r="5" fill="#cba6f6"/>
</svg>
