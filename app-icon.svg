<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="32" y1="24" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#b4befe"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="40" y1="40" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#74c7ec"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="#313244" stroke-width="2"/>

  <!-- Glow Effect Underlay -->
  <circle cx="64" cy="64" r="32" fill="#89b4fa" opacity="0.18" filter="url(#glow)"/>

  <!-- Base Trunk Branch Line -->
  <path d="M44 26 V102" stroke="#45475a" stroke-width="6" stroke-linecap="round"/>
  <path d="M44 42 V86" stroke="url(#primary-grad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Virtual Feature Branch (Fork & Merge-Back Arc) -->
  <path d="M44 42 C44 58, 84 52, 84 66 C84 80, 44 76, 44 92" 
        stroke="url(#accent-grad)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Base Branch Commits -->
  <circle cx="44" cy="36" r="8" fill="#1e1e2e" stroke="#89b4fa" stroke-width="5"/>
  <circle cx="44" cy="94" r="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="5"/>

  <!-- Feature Branch Commit -->
  <circle cx="84" cy="66" r="9" fill="#181825" stroke="#cba6f7" stroke-width="5"/>
  <circle cx="84" cy="66" r="4" fill="#cba6f7"/>

  <!-- Mini Sandbox Sparkle / Stage0 Ring -->
  <circle cx="44" cy="94" r="3" fill="#a6e3a1"/>
</svg>
